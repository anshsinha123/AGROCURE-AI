    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', 'Noto Sans Kannada', 'Noto Sans Tamil', sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      transition: all 0.2s ease;
    }
    .dark .glass-card {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(51, 65, 85, 0.65);
    }
    .hover-lift {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }
    .dark .hover-lift:hover {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);

      width: 6px;
      height: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
    .dark .scrollbar-thin::-webkit-scrollbar-thumb {
      background-color: #334155;
    }
    @keyframes agrobot-glow {
      0%, 100% {
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.45), 0 0 30px rgba(16, 185, 129, 0.25);
      }
      50% {
        box-shadow: 0 0 25px rgba(16, 185, 129, 0.75), 0 0 45px rgba(16, 185, 129, 0.4);
      }
    }
    .agrobot-pulse-glow {
      animation: agrobot-glow 2.5s infinite ease-in-out;
    }
    @keyframes subtle-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .animate-float {
      animation: subtle-float 3s ease-in-out infinite;
    }
    @keyframes laser-sweep {
      0% {
        top: 2%;
        opacity: 0.9;
      }
      50% {
        top: 94%;
        opacity: 1;
      }
      100% {
        top: 2%;
        opacity: 0.9;
      }
    }
    .laser-scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent 0%, #10b981 15%, #34d399 50%, #10b981 85%, transparent 100%);
      box-shadow: 0 0 16px #10b981, 0 0 30px #059669;
      animation: laser-sweep 2.2s ease-in-out infinite;
      z-index: 25;
    }
    .scanner-grid {
      background-size: 24px 24px;

        linear-gradient(to right, rgba(16, 185, 129, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(16, 185, 129, 0.12) 1px, transparent 1px);
    }
  </style>

    const PROJECT_TECH_STACK = [

          },

          }
        ]
      },
      {

        techs: [
          {

    function AgroCureApp() {
      // 14 Pages:
      // 'home', 'login', 'register', 'dashboard', 'detection', 'result',
      // 'organic', 'inorganic', 'diseases', 'history', 'profile', 'about', 'contact', 'feedback'
      const [currentPage, setCurrentPage] = useState('home');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Language state: 'en', 'hi', 'kn', 'mr', 'ta'
      const [lang, setLang] = useState(() => localStorage.getItem('agrocure_lang') || 'en');

      // Theme state: 'light' or 'dark'
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem('agrocure_theme');
        if (saved) return saved;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      });

      // User state
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('agrocure_user');
        return saved ? JSON.parse(saved) : null;
      });

      // Scan & Diagnosis state
      const [selectedImage, setSelectedImage] = useState('/static/samples/sample_tomato_early_blight.jpg');
      const [annotatedImage, setAnnotatedImage] = useState(null);
      const [isShowingAnnotated, setIsShowingAnnotated] = useState(false);
      const [loading, setLoading] = useState(false);
      const [scanResult, setScanResult] = useState(null);
      const [cropFilter, setCropFilter] = useState('All');
      const [selectedModel, setSelectedModel] = useState('model_1');
      const [availableModels, setAvailableModels] = useState([]);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [cameraOpen, setCameraOpen] = useState(false);
      const [cameraStream, setCameraStream] = useState(null);
      const [cameraError, setCameraError] = useState('');
      const cameraVideoRef = useRef(null);
      const cameraStreamRef = useRef(null);
      const cameraRequestRef = useRef(0);

      // 10-Second Leaf Scanning Experience State
      const [isScanning, setIsScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState(0); // 0 to 100%
      const [scanTimeLeft, setScanTimeLeft] = useState("10.0"); // 10.0s down to 0.0s
      const [scanPhaseIndex, setScanPhaseIndex] = useState(0); // 0 to 4
      const [scanTelemetryLogs, setScanTelemetryLogs] = useState([]);
      const scanTimerRef = useRef(null);
      const scanApiResultRef = useRef(null);

      // Data collections
      const [history, setHistory] = useState([]);
      const [diseases, setDiseases] = useState([]);
      const [analytics, setAnalytics] = useState(null);
      const [feedbackList, setFeedbackList] = useState([]);
      const [avgRating, setAvgRating] = useState(5.0);
      const [teamMembers, setTeamMembers] = useState(TEAM_MEMBERS);
      const [teamDraft, setTeamDraft] = useState(null);
      const [teamSaving, setTeamSaving] = useState(false);
      const [teamError, setTeamError] = useState('');
      const canManageTeam = ['admin', 'developer'].includes((user && user.role || '').toLowerCase());

      // Disease catalog filter & search
      const [diseaseSearch, setDiseaseSearch] = useState('');
      const [diseaseCropFilter, setDiseaseCropFilter] = useState('All');
      const [activeDiseaseModal, setActiveDiseaseModal] = useState(null);

      // Forms state
      const [loginForm, setLoginForm] = useState({ email: '', password: '' });
      const [registerForm, setRegisterForm] = useState({ name: '', email: '', password: '', role: 'Farmer', farm_location: '', farm_size: '3 Acres', preferred_crop: 'Tomato' });
      const [feedbackForm, setFeedbackForm] = useState({ name: '', role: 'Farmer', crop: 'Tomato', rating: 5, comment: '' });
      const [contactForm, setContactForm] = useState({ name: '', email: '', phone: '', subject: 'Diagnosis Assistance', message: '' });
      const [contactSuccess, setContactSuccess] = useState(false);
      const [feedbackSuccess, setFeedbackSuccess] = useState(false);

      // User Profile Editing & Avatar State
      const [isEditingProfile, setIsEditingProfile] = useState(false);
      const [profileUpdateSuccess, setProfileUpdateSuccess] = useState(false);

      // AgroBot AI Assistant State
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        {
          id: 1,
          sender: 'bot',
          text: "Hello! 👋 I am **AgroBot AI**, your agricultural foliar assistant.\n\nAsk me anything about identifying or treating diseases in **Tomato, Potato, Capsicum, or Grapes**!",
          time: "Just now",
          suggestions: [
            "Tomato Early Blight organic cure",
            "Potato Late Blight chemical spray",
            "Capsicum Bacterial Spot symptoms",
            "Grapes Black Rot treatment",
            "How to scan a leaf photo?"
          ]
        }
      ]);
      const [inputMessage, setInputMessage] = useState('');
      const [chatLoading, setChatLoading] = useState(false);
      const [showWelcomeBubble, setShowWelcomeBubble] = useState(() => {
        return !localStorage.getItem('agrocure_welcome_seen');
      });
      const [isVoiceListening, setIsVoiceListening] = useState(false);
      const chatEndRef = useRef(null);

      // Auto-scroll chat to latest message
      useEffect(() => {
        if (isChatOpen && chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages, isChatOpen]);

      // Dismiss welcome bubble
      const dismissWelcomeBubble = (e) => {
        e && e.stopPropagation();
        setShowWelcomeBubble(false);
        localStorage.setItem('agrocure_welcome_seen', 'true');
      };

      // Send Chat Message to /api/chat
      const sendChatMessage = async (msgText) => {
        const text = (typeof msgText === 'string' ? msgText : inputMessage).trim();
        if (!text || chatLoading) return;

        const userMsg = {
          id: Date.now(),
          sender: 'user',
          text: text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setChatMessages(prev => [...prev, userMsg]);
        setInputMessage('');
        setChatLoading(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: text,
              crop: cropFilter !== 'All' ? cropFilter : 'Auto-Detect',
              lang: lang
            })
          });
          const data = await res.json();
          const botMsg = {
            id: Date.now() + 1,
            sender: 'bot',
            text: data.reply || "I am analyzing the disease catalog. Please try asking about Tomato, Potato, Capsicum, or Grapes.",
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            suggestions: data.suggestions || [],
            matched_disease: data.matched_disease
          };
          setChatMessages(prev => [...prev, botMsg]);
        } catch (err) {
          setChatMessages(prev => [
            ...prev,
            {
              id: Date.now() + 1,
              sender: 'bot',
              text: "⚠️ Server communication error: Unable to contact AgroBot AI. Please verify backend connection.",
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }
          ]);
        } finally {
          setChatLoading(false);
        }
      };

      // Voice recognition for Chatbot
      const startVoiceRecognition = () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert("Speech recognition is not supported in this browser. Please type your message.");
          return;
        }
        try {
          const recognition = new SpeechRec();
          const map = { hi: 'hi-IN', kn: 'kn-IN', mr: 'mr-IN', ta: 'ta-IN', en: 'en-US' };
          recognition.lang = map[lang] || 'en-US';
          recognition.interimResults = false;
          recognition.onstart = () => setIsVoiceListening(true);
          recognition.onend = () => setIsVoiceListening(false);
          recognition.onerror = () => setIsVoiceListening(false);
          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            if (transcript) {
              sendChatMessage(transcript);
            }
          };
          recognition.start();
        } catch (e) {
          setIsVoiceListening(false);
        }
      };

      // Bot message audio readout
      const speakBotMessage = (text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const clean = text.replace(/[*#_`•]/g, ' ');
        const utterance = new SpeechSynthesisUtterance(clean);
        const map = { hi: 'hi-IN', kn: 'kn-IN', mr: 'mr-IN', ta: 'ta-IN', en: 'en-US' };
        utterance.lang = map[lang] || 'en-US';
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      };

      // Apply theme
      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        localStorage.setItem('agrocure_theme', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');

      // Change language
      const handleLangChange = (l) => {
        setLang(l);
        localStorage.setItem('agrocure_lang', l);
      };

      // Translation helper
      const t = (key) => {
        const set = DICT[lang] || DICT['en'] || {};
        return set[key] || (DICT['en'] && DICT['en'][key]) || key;
      };

      // Initial data fetch
      useEffect(() => {
        fetchModels();
        fetchHistory();
        fetchDiseases(lang);
        fetchAnalytics();
        fetchFeedback();
      }, [lang]);

      const fetchModels = async () => {
        try {
          const res = await fetch('/api/models');
          const data = await res.json();
          if (data && data.models) setAvailableModels(data.models);
        } catch (e) {
          console.warn(e);
        }
      };

      useEffect(() => {
        fetchTeam();
      }, []);

      const fetchHistory = async () => {
        try {
          const res = await fetch('/api/scans');
          const data = await res.json();
          setHistory(Array.isArray(data) ? data : []);
        } catch (e) {
          console.warn(e);
        }
      };

      const fetchDiseases = async (curLang) => {
        try {
          const res = await fetch(`/api/diseases?lang=${curLang}`);
          const data = await res.json();
          setDiseases(data.diseases || []);
        } catch (e) {
          console.warn(e);
        }
      };

      const fetchAnalytics = async () => {
        try {
          const res = await fetch('/api/analytics');
          const data = await res.json();
          setAnalytics(data);
        } catch (e) {
          console.warn(e);
        }
      };

      const fetchFeedback = async () => {
        try {
          const res = await fetch('/api/feedback');
          const data = await res.json();
          setFeedbackList(data.feedback || []);
          setAvgRating(data.average_rating || 5.0);
        } catch (e) {
          console.warn(e);
        }
      };

      const fetchTeam = async () => {
        try {
          const res = await fetch('/api/team');
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Failed to load team profiles.');
          if (Array.isArray(data.team) && data.team.length) setTeamMembers(data.team);
        } catch (e) {
          console.error('Unable to load team profiles:', e);
          setTeamError(e.message || 'Unable to load team profiles.');
        }
      };

      const openTeamEditor = (member) => {
        setTeamDraft({
          ...member,
          skillsText: (member.skills || []).join(', '),
          avatarFile: null
        });
        setTeamError('');
      };

      const saveTeamMember = async (e) => {
        e.preventDefault();
        const token = localStorage.getItem('agrocure_token');
        if (!token) {
          setTeamError('Your sign-in session is missing or expired. Sign in again with an Admin or Developer account.');
          return;
        }

        setTeamSaving(true);
        setTeamError('');
        try {
          let image = teamDraft.image;
          if (teamDraft.avatarFile) {
            const formData = new FormData();
            formData.append('file', teamDraft.avatarFile);
            const avatarRes = await fetch('/api/team/avatar', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}` },
              body: formData
            });
            const avatarData = await avatarRes.json();
            if (!avatarRes.ok) throw new Error(avatarData.detail || 'Failed to upload team photo.');
            image = avatarData.image_url;
          }

          const { skillsText, avatarFile, ...profile } = teamDraft;
          const updatedMember = {
            ...profile,
            image,
            initials: profile.name.trim().split(/\s+/).map((part) => part[0]).join('').slice(0, 2).toUpperCase(),
            skills: skillsText.split(',').map((skill) => skill.trim()).filter(Boolean)
          };
          const updatedTeam = teamMembers.map((member) =>
            String(member.id) === String(updatedMember.id) ? updatedMember : member
          );
          const res = await fetch('/api/team', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ team: updatedTeam })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Failed to save team profile.');
          setTeamMembers(data.team);
          setTeamDraft(null);
        } catch (err) {
          setTeamError(err.message || 'Failed to save team profile.');
        } finally {
          setTeamSaving(false);
        }
      };

      // 5 Diagnostic Phases of 10-Second Foliar Scan
      const SCAN_PHASES = [
        {
          id: 0,
          title: "Phase 1: MobileNetV2 Neural Tensor Pipeline",
          desc: "Standardizing RGB tensor matrix (224×224×3) & loading foliar weights",
          metric: "TENSOR: 224x224 RGB",
          icon: "fa-network-wired"
        },
        {
          id: 1,
          title: "Phase 2: OpenCV Leaf Boundary Segmentation",
          desc: "HSV thresholding isolating foliar lamina contours from background",
          metric: "OPENCV: Contour Mask Isolated",
          icon: "fa-vector-square"
        },
        {
          id: 2,
          title: "Phase 3: Excess Green (ExG) Chlorophyll Index",
          desc: "Computing ExG = 2G - R - B spectral reflectance & cellular vigor",
          metric: "SPECTRAL: ExG Chlorophyll 0.428",
          icon: "fa-leaf"
        },
        {
          id: 3,
          title: "Phase 4: Necrotic Lesion Quantification",
          desc: "Measuring diseased lesion spot density & foliar damage severity",
          metric: "LESION: Cluster Severity Mapping",
          icon: "fa-crosshairs"
        },
        {
          id: 4,
          title: "Phase 5: 19-Class Pathogen Classification & Prescription",
          desc: "Softmax probability matching & synthesizing dual treatment remedies",
          metric: "DIAGNOSIS: Synthesizing RX",
          icon: "fa-circle-check"
        }
      ];

      // Clean up scan interval on unmount
      useEffect(() => {
        return () => {
          if (scanTimerRef.current) clearInterval(scanTimerRef.current);
          if (cameraStreamRef.current) {
            cameraStreamRef.current.getTracks().forEach(track => track.stop());
          }
        };
      }, []);

      useEffect(() => {
        const video = cameraVideoRef.current;
        if (video && cameraStream) {
          video.srcObject = cameraStream;
          video.play().catch(err => {
            console.error("Camera preview error:", err);
            setCameraError("Could not start the camera preview. Check your browser permissions and try again.");
          });
        }
      }, [cameraStream, cameraOpen]);

      const stopCamera = () => {
        cameraRequestRef.current += 1;
        if (cameraStreamRef.current) {
          cameraStreamRef.current.getTracks().forEach(track => track.stop());
          cameraStreamRef.current = null;
        }
        setCameraStream(null);
        setCameraOpen(false);
      };

      const openCamera = async () => {
        setCameraError('');
        setCameraOpen(true);

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setCameraError(window.isSecureContext === false
            ? "Camera access requires HTTPS or localhost. Open AgroCure on this device using localhost or a secure HTTPS address."
            : "Camera access is not supported by this browser.");
          return;
        }

        const requestId = ++cameraRequestRef.current;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
          if (requestId !== cameraRequestRef.current) {
            stream.getTracks().forEach(track => track.stop());
            return;
          }
          cameraStreamRef.current = stream;
          setCameraStream(stream);
        } catch (err) {
          console.error("Camera access error:", err);
          const messages = {
            NotAllowedError: "Camera permission was denied. Allow camera access in your browser settings and try again.",
            NotFoundError: "No camera was found on this device.",
            NotReadableError: "The camera is already in use by another application."
          };
          setCameraError(messages[err.name] || "Could not access the camera. Check browser permissions and try again.");
        }
      };

      const captureCameraImage = () => {
        const video = cameraVideoRef.current;
        if (!video || !video.videoWidth || !video.videoHeight) {
          setCameraError("The camera is still starting. Please wait a moment and try again.");
          return;
        }

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext('2d');
        if (!context) {
          setCameraError("Could not capture the camera image. Please try again.");
          return;
        }

        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          if (!blob) {
            setCameraError("Could not capture the camera image. Please try again.");
            return;
          }
          const imageFile = new File([blob], `leaf-capture-${Date.now()}.jpg`, { type: 'image/jpeg' });
          stopCamera();
          handleFileUpload(imageFile);
        }, 'image/jpeg', 0.92);
      };

      const runTenSecondScan = (apiPromise, previewImageUrl) => {
        if (previewImageUrl) setSelectedImage(previewImageUrl);
        setIsScanning(true);
        setLoading(true);
        setScanProgress(0);
        setScanTimeLeft("10.0");
        setScanPhaseIndex(0);
        setScanTelemetryLogs([
          `[00:00.0] Initializing AgroCure AI Foliar Pathology Engine v2.4...`,
          `[00:00.2] Binding OpenCV vision pipeline and MobileNetV2 neural weights...`
        ]);
        scanApiResultRef.current = null;

        // Background API call executes simultaneously
        apiPromise
          .then(data => {
            scanApiResultRef.current = data;
          })
          .catch(err => {
            console.error("Scan API fetch error:", err);
            scanApiResultRef.current = { error: err.message };
          });

        const totalMs = 10000;
        const intervalMs = 50;
        let elapsed = 0;

        if (scanTimerRef.current) clearInterval(scanTimerRef.current);

        scanTimerRef.current = setInterval(() => {
          elapsed += intervalMs;
          const pct = Math.min(100, Math.round((elapsed / totalMs) * 100));
          const remainingSec = Math.max(0, (10 - elapsed / 1000)).toFixed(1);
          setScanProgress(pct);
          setScanTimeLeft(remainingSec);

          const currentPhase = Math.min(4, Math.floor(elapsed / 2000));
          setScanPhaseIndex(currentPhase);

          if (elapsed === 2000) {
            setScanTelemetryLogs(prev => [
              ...prev,
              `[00:02.0] ✓ Phase 1 Complete: 224x224 RGB tensor normalized.`,
              `[00:02.0] → Phase 2 Started: OpenCV contour segmentation isolating foliar boundaries...`
            ]);
          } else if (elapsed === 4000) {
            setScanTelemetryLogs(prev => [
              ...prev,
              `[00:04.0] ✓ Phase 2 Complete: Vegetative contour detected.`,
              `[00:04.0] → Phase 3 Started: Calculating Excess Green (ExG = 2G - R - B) chlorophyll index...`
            ]);
          } else if (elapsed === 6000) {
            setScanTelemetryLogs(prev => [
              ...prev,
              `[00:06.0] ✓ Phase 3 Complete: Chlorophyll index mapped.`,
              `[00:06.0] → Phase 4 Started: Necrotic foliar lesion quantification & severity measurement...`
            ]);
          } else if (elapsed === 8000) {
            setScanTelemetryLogs(prev => [
              ...prev,
              `[00:08.0] ✓ Phase 4 Complete: Lesion density mapped.`,
              `[00:08.0] → Phase 5 Started: MobileNetV2 19-class softmax prediction & multilingual prescription...`
            ]);
          }

          if (elapsed >= totalMs) {
            clearInterval(scanTimerRef.current);
            scanTimerRef.current = null;
            finishScan();
          }
        }, intervalMs);
      };

      const finishScan = () => {
        if (scanTimerRef.current) {
          clearInterval(scanTimerRef.current);
          scanTimerRef.current = null;
        }
        setScanProgress(100);
        setScanTimeLeft("0.0");
        setScanPhaseIndex(4);
        setScanTelemetryLogs(prev => [
          ...prev,
          `[00:10.0] ✓ Scan completed successfully! Generating diagnostic report...`
        ]);

        const applyResult = (data) => {
          setLoading(false);
          if (data && !data.error) {
            setScanResult(data);
            setAnnotatedImage(data.detection ? data.detection.annotated_image : null);
            setIsShowingAnnotated(true);
            fetchHistory();
            fetchAnalytics();
            setTimeout(() => {
              setIsScanning(false);
              setCurrentPage('result');
            }, 500);
          } else {
            alert("Scan failed: " + (data ? data.error : "Unknown error"));
            setIsScanning(false);
          }
        };

        const existingData = scanApiResultRef.current;
        if (existingData) {
          applyResult(existingData);
        } else {
          const checkWait = setInterval(() => {
            const d = scanApiResultRef.current;
            if (d) {
              clearInterval(checkWait);
              applyResult(d);
            }
          }, 150);
        }
      };

      const skipScan = () => {
        finishScan();
      };

      // 1-Click sample test (10-second scanning experience)
      const handleSampleClick = (sampleId, cropName) => {
        const map = {
          tomato_early_blight: "/static/samples/sample_tomato_early_blight.jpg",
          potato_late_blight: "/static/samples/sample_potato_late_blight.jpg",
          capsicum_bacterial_spot: "/static/samples/sample_capsicum_bacterial_spot.jpg",
          grapes_black_rot: "/static/samples/sample_grapes_black_rot.jpg"
        };
        const sampleUrl = map[sampleId] || map.tomato_early_blight;
        setSelectedImage(sampleUrl);

        const uid = (user && user.id) ? encodeURIComponent(user.id) : 'grower_default';
        const apiPromise = fetch(`/api/scan-sample/${sampleId}?selected_model=${selectedModel}&lang=${lang}&user_id=${uid}`, { method: 'POST' })
          .then(async (res) => {
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'The sample scan failed.');
            return data;
          });

        runTenSecondScan(apiPromise, sampleUrl);
      };

      // File upload handler (10-second scanning experience)
      const handleFileUpload = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const previewUrl = e.target.result;
          setSelectedImage(previewUrl);

          const formData = new FormData();
          formData.append('image', file);
          formData.append('crop_hint', cropFilter);
          formData.append('selected_model', selectedModel);
          formData.append('lang', lang);
          if (user && user.id) {
            formData.append('user_id', user.id);
          }

          const apiPromise = fetch('/api/scan', {
            method: 'POST',
            body: formData
          }).then(async (res) => {
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'The image scan failed.');
            return data;
          });

          runTenSecondScan(apiPromise, previewUrl);
        };
        reader.readAsDataURL(file);
      };

      // Web Speech API Voice Synthesis in 5 languages
      const speakDiagnosis = () => {
        if (!('speechSynthesis' in window) || !scanResult) return;
        if (isSpeaking) {
          window.speechSynthesis.cancel();
          setIsSpeaking(false);
          return;
        }

        const p = scanResult.prediction;
        const tObj = scanResult.treatment;
        let text = "";

        if (lang === 'hi') {
          text = `फसल का नाम: ${p.localized_crop}। रोग निदान: ${p.localized_disease}। रोग की गंभीरता: ${p.severity}। मुख्य जैविक उपचार: ${tObj.organic[0] || ''}। रासायनिक उपचार: ${tObj.chemical[0] || ''}।`;
        } else if (lang === 'kn') {
          text = `ಬೆಳೆ: ${p.localized_crop}. ರೋಗ: ${p.localized_disease}. ತೀವ್ರತೆ: ${p.severity}. ಸಾವಯವ ಪರಿಹಾರ: ${tObj.organic[0] || ''}.`;
        } else if (lang === 'mr') {
          text = `पीक: ${p.localized_crop}। रोग: ${p.localized_disease}। तीव्रता: ${p.severity}। मुख्य सेंद्रिय उपाय: ${tObj.organic[0] || ''}।`;
        } else if (lang === 'ta') {
          text = `பயிர்: ${p.localized_crop}. நோய்: ${p.localized_disease}. தீவிரம்: ${p.severity}. இயற்கை சிகிச்சை: ${tObj.organic[0] || ''}.`;
        } else {
          text = `Diagnosed crop: ${p.localized_crop}. Disease: ${p.localized_disease}. Severity level: ${p.severity}. Primary organic remedy: ${tObj.organic[0] || ''}. Recommended chemical: ${tObj.chemical[0] || ''}.`;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        const map = { hi: 'hi-IN', kn: 'kn-IN', mr: 'mr-IN', ta: 'ta-IN', en: 'en-US' };
        utterance.lang = map[lang] || 'en-US';
        utterance.rate = 0.95;
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);

        setIsSpeaking(true);
        window.speechSynthesis.speak(utterance);
      };

      // Login handler
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(loginForm)

          const data = await res.json();
          if (res.ok) {
            setUser(data.user);
            localStorage.setItem('agrocure_user', JSON.stringify(data.user));
            localStorage.setItem('agrocure_token', data.token);
            alert("Login successful! Welcome " + data.user.name);
            setCurrentPage('dashboard');
          } else {
            alert(data.detail || "Login failed");
          }
        } catch (err) {
          alert("Login error: " + err.message);
        }
      };

      // Register handler
      const handleRegisterSubmit = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(registerForm)
          });
          const data = await res.json();
          if (res.ok) {
            setUser(data.user);
            localStorage.setItem('agrocure_user', JSON.stringify(data.user));
            localStorage.setItem('agrocure_token', data.token);
            alert("Account registered successfully! Welcome " + data.user.name);
            setCurrentPage('dashboard');
          } else {
            alert(data.detail || "Registration failed");
          }
        } catch (err) {
          alert("Registration error: " + err.message);
        }

      // Profile picture upload handler
      const handleAvatarUpload = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          const dataUrl = event.target.result;
          const updated = { ...user, avatar: dataUrl };
          setUser(updated);
          localStorage.setItem('agrocure_user', JSON.stringify(updated));

          try {
            const formData = new FormData();
            formData.append('avatar', file);
            const res = await fetch('/api/auth/avatar', {
              method: 'POST',
              headers: { Authorization: `Bearer ${localStorage.getItem('agrocure_token') || ''}` },
              body: formData
            });
            const data = await res.json();
            if (data.avatar_url) {
              const finalUser = { ...updated, avatar: data.avatar_url };
              setUser(finalUser);
              localStorage.setItem('agrocure_user', JSON.stringify(finalUser));
            }
          } catch (err) {
            console.warn("Avatar backend sync error", err);
          }
        };
        reader.readAsDataURL(file);
      };

      // Remove profile picture handler
      const handleRemoveAvatar = async () => {
        const updated = { ...user, avatar: null };
        setUser(updated);
        localStorage.setItem('agrocure_user', JSON.stringify(updated));
        try {
          await fetch('/api/auth/profile', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${localStorage.getItem('agrocure_token') || ''}`
            },
            body: JSON.stringify({ ...updated, avatar: "" })
          });
        } catch (err) {
          console.warn("Avatar removal error", err);
        }
      };

      // Profile update handler
      const handleProfileUpdate = async (e) => {
        e && e.preventDefault();
        try {
          const res = await fetch('/api/auth/profile', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${localStorage.getItem('agrocure_token') || ''}`
            },
            body: JSON.stringify({
              name: user.name,
              email: user.email,
              role: user.role,
              phone: user.phone || '',
              bio: user.bio || '',
              farm_location: user.farm_location,
              farm_size: user.farm_size,
              preferred_crop: user.preferred_crop,
              preferred_lang: user.preferred_lang || lang,
              theme: theme,
              avatar: user.avatar || ''
            })
          });
          const data = await res.json();
          if (res.ok) {
            setUser(data.user);
            localStorage.setItem('agrocure_user', JSON.stringify(data.user));
            setProfileUpdateSuccess(true);
            setIsEditingProfile(false);
            setTimeout(() => setProfileUpdateSuccess(false), 4000);
          } else {
            alert(data.detail || "Update failed");
          }
        } catch (err) {
          alert("Update error: " + err.message);
        }
      };

      // Feedback submission handler
      const handleFeedbackSubmit = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: feedbackForm.name || user.name,
              role: feedbackForm.role || user.role,
              crop: feedbackForm.crop,
              rating: feedbackForm.rating,
              comment: feedbackForm.comment
            })
          });
          if (res.ok) {
            setFeedbackSuccess(true);
            setFeedbackForm({ name: '', role: 'Farmer', crop: 'Tomato', rating: 5, comment: '' });
            fetchFeedback();
            setTimeout(() => setFeedbackSuccess(false), 5000);
          }
        } catch (err) {
          alert("Feedback submission failed: " + err.message);
        }
      };

      // Contact message handler
      const handleContactSubmit = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(contactForm)
          });
          if (res.ok) {
            setContactSuccess(true);
            setContactForm({ name: '', email: '', phone: '', subject: 'Diagnosis Assistance', message: '' });
            setTimeout(() => setContactSuccess(false), 5000);
          }
        } catch (err) {
          alert("Message failed: " + err.message);
        }
      };

      // Export CSV
      const exportCSV = () => {
        if (!history.length) return alert("No scans to export!");
        const headers = ["ID", "Timestamp", "Crop", "Disease", "Severity", "Confidence %", "Lesion %", "Healthy %"];
        const rows = history.map(h => [
          h.id, h.timestamp, h.crop, h.disease, h.severity, h.confidence, h.lesion_pct, h.healthy_green_pct
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `AgroCure_Scans_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Clear history
      const clearHistory = async () => {
        if (!confirm("Are you sure you want to clear all scan history logs?")) return;
        await fetch('/api/scans', { method: 'DELETE' });
        setHistory([]);
        fetchAnalytics();
      };

      return (
        <div className="flex-1 flex flex-col min-h-screen">

          {/* ==================== GLOBAL NAVBAR ==================== */}
          <header className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50 shadow-xs transition-colors duration-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Brand Logo & Title */}
              <div 
                className="flex items-center space-x-3 cursor-pointer" 
                onClick={() => { setCurrentPage('home'); setMobileMenuOpen(false); }}
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 via-green-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                  <i className="fa-solid fa-leaf text-lg"></i>
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="text-xl font-black tracking-tight text-slate-900 dark:text-white">AGROCURE AI</span>
                  </div>
                  <p className="text-[11px] text-slate-500 dark:text-slate-400 font-medium truncate max-w-xs sm:max-w-md hidden md:block">
                    AI-Based Plant Disease Detection System
                  </p>
                </div>
              </div>

              {/* Desktop Nav Links */}
              <nav className="hidden xl:flex items-center space-x-1">
                {[
                  { id: 'home', label: t('nav_home'), icon: 'fa-house' },
                  { id: 'dashboard', label: t('nav_dashboard'), icon: 'fa-chart-pie' },
                  { id: 'detection', label: t('nav_detection'), icon: 'fa-microscope' },
                  { id: 'organic', label: t('nav_organic'), icon: 'fa-seedling' },
                  { id: 'inorganic', label: t('nav_inorganic'), icon: 'fa-flask' },
                  { id: 'diseases', label: t('nav_diseases'), icon: 'fa-book-medical' },
                  { id: 'history', label: t('nav_history'), icon: 'fa-clock-rotate-left' },
                  { id: 'about', label: t('nav_about'), icon: 'fa-graduation-cap' },
                  { id: 'contact', label: t('nav_contact'), icon: 'fa-headset' },
                  { id: 'feedback', label: t('nav_feedback'), icon: 'fa-star' }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setCurrentPage(item.id)}
                    className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-1.5 ${
                      currentPage === item.id
                        ? 'bg-emerald-600 text-white shadow-xs'
                        : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                    }`}
                  >
                    <i className={`fa-solid ${item.icon} text-xs`}></i>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>

              {/* Utility Actions: Dark/Light Mode, 5-Language Switcher, User Auth */}
              <div className="flex items-center space-x-2">
                
                {/* Dark / Light Toggle */}
                <button
                  onClick={toggleTheme}
                  title={theme === 'dark' ? "Switch to Light Mode" : "Switch to Dark Mode"}
                  className="w-8 h-8 rounded-lg flex items-center justify-center transition border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-amber-400 shadow-xs"
                >
                  <i className={`fa-solid ${theme === 'dark' ? 'fa-sun text-amber-400' : 'fa-moon text-slate-600'} text-xs`}></i>
                </button>

                {/* 5-Language Switcher */}
                <div className="flex bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-bold">
                  {[
                    { code: 'en', label: 'EN' },
                    { code: 'hi', label: 'हिंदी' },
                    { code: 'kn', label: 'ಕನ್ನಡ' },

                    <button

                      className={`px-1.5 py-1 rounded-md transition ${

                    >
                      {l.label}

                </div>

                {/* User Profile / Auth Button */}
                <button
                  onClick={() => setCurrentPage(user ? 'profile' : 'login')}
                  className="flex items-center space-x-2 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-750 transition text-xs font-bold shadow-xs"
                >
                  {user && user.avatar ? (
                    <img src={user.avatar} alt="Profile" className="w-5 h-5 rounded-full object-cover border border-emerald-500" />

                    <div className="w-5 h-5 rounded-full bg-emerald-600 text-white flex items-center justify-center text-[10px] font-bold">
                      {user && user.name ? user.name.charAt(0) : <i className="fa-solid fa-user"></i>}

        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();

        const data = analytics && analytics.crop_distribution ? analytics.crop_distribution : {
          Tomato: 14, Potato: 8, Capsicum: 6, Grapes: 7
        };

        chartInstanceRef.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: Object.keys(data),
            datasets: [{
              data: Object.values(data),
              backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#8b5cf6'],
              borderWidth: 2,
              borderColor: '#ffffff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: { boxWidth: 12, font: { size: 11, family: 'Plus Jakarta Sans' } }
              }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [analytics]);

      return <canvas ref={canvasRef}></canvas>;
    }

    // Chart.js Helper: Bar Chart
    function DashboardBarChart({ analytics }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();

        const data = analytics && analytics.severity_distribution ? analytics.severity_distribution : {
          Low: 5, Moderate: 12, High: 8, None: 3
        };

        chartInstanceRef.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: Object.keys(data),
            datasets: [{
              label: 'Scanned Foliar Leaves',
              data: Object.values(data),
              backgroundColor: ['#10b981', '#f59e0b', '#ef4444', '#3b82f6'],
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: true, grid: { display: false } },
              x: { grid: { display: false } }
            },
            plugins: {
              legend: { display: false }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [analytics]);

      return <canvas ref={canvasRef}></canvas>;
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AgroCureApp />);
  </script>
</body>
</html>
